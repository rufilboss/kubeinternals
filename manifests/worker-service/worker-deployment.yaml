apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: production
  labels:
    app: worker-service
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
        version: v1
    spec:
      containers:
      - name: worker
        image: busybox:1.36
        # In production, use your actual worker image
        # image: your-registry/worker-service:latest
        command:
        - sh
        - -c
        - |
          echo "Worker service starting..."
          echo "Connecting to Redis: $REDIS_HOST"
          echo "Connecting to PostgreSQL: $POSTGRES_HOST"
          touch /tmp/worker-ready
          echo "Worker service ready"
          while true; do
            echo "$(date): Processing jobs..."
            sleep 30
          done
        env:
        - name: REDIS_HOST
          value: redis-service.production.svc.cluster.local
        - name: POSTGRES_HOST
          value: postgres-service.production.svc.cluster.local
        - name: POSTGRES_DB
          value: appdb
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - "ps aux | grep -v grep | grep worker || exit 1"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - "test -f /tmp/worker-ready || exit 1"
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: workdir
          mountPath: /tmp
      volumes:
      - name: workdir
        emptyDir: {}
      terminationGracePeriodSeconds: 60
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: worker-service
  namespace: production
  labels:
    app: worker-service
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: worker-service

